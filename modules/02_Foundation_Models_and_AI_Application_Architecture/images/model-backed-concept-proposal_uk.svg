<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Операція пропозиції поняття з використанням моделі</title>
  <desc id="desc">Фрагмент джерела та контракт кандидата збираються як контекст, надсилаються через живий адаптер моделі або детерміновану тестову фікстуру, розбираються як кандидат, перевіряються детерміновано, розглядаються уповноваженим рецензентом, прив’язуються до рішення і застосовуються лише після відповідного затвердження. Кожна відмова залишає канонічні знання незмінними і фіксується в телеметрії.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .source{fill:#ede9fe;stroke:#7c3aed;stroke-width:2.7}.process{fill:#e0f2fe;stroke:#0284c7;stroke-width:2.7}.control{fill:#ecfdf5;stroke:#059669;stroke-width:2.7}.human{fill:#fef3c7;stroke:#d97706;stroke-width:2.7}.state{fill:#ede9fe;stroke:#7c3aed;stroke-width:3}.reject{fill:#fff7ed;stroke:#ea580c;stroke-width:3}.telemetry{fill:#f8fafc;stroke:#64748b;stroke-width:2.5}.line{stroke:#334155;stroke-width:2.8;fill:none;marker-end:url(#arrow)}.fixture{stroke:#7c3aed;stroke-width:2.8;stroke-dasharray:9 7;fill:none;marker-end:url(#arrow)}.fail{stroke:#ea580c;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.observe{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none}.title{font:700 28px system-ui,sans-serif;fill:#0f172a}.label{font:700 17px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#334155}.tiny{font:13px system-ui,sans-serif;fill:#475569}.no{font:700 13px system-ui,sans-serif;fill:#c2410c}.caption{font:700 17px system-ui,sans-serif;fill:#9a3412}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="title">Модель пропонує; детерміновані та людські засоби керування уповноважують будь-який прийнятий запис</text>

  <rect x="35" y="155" width="180" height="130" rx="15" class="source"/>
  <text x="125" y="193" text-anchor="middle" class="label">Фрагмент джерела</text>
  <text x="125" y="225" text-anchor="middle" class="small">Зареєстровані докази</text>
  <text x="125" y="250" text-anchor="middle" class="small">та ідентичність джерела</text>

  <rect x="260" y="155" width="190" height="130" rx="15" class="process"/>
  <text x="355" y="193" text-anchor="middle" class="label">Побудувати контекст</text>
  <text x="355" y="225" text-anchor="middle" class="small">Інструкція · докази</text>
  <text x="355" y="250" text-anchor="middle" class="small">контракт кандидата</text>

  <rect x="505" y="120" width="205" height="105" rx="15" class="process"/>
  <text x="607" y="158" text-anchor="middle" class="label">Живий адаптер моделі</text>
  <text x="607" y="188" text-anchor="middle" class="small">Ймовірнісне генерування</text>

  <rect x="505" y="260" width="205" height="105" rx="15" class="source"/>
  <text x="607" y="298" text-anchor="middle" class="label">Детермінована фікстура</text>
  <text x="607" y="328" text-anchor="middle" class="small">Детермінований тест межі</text>

  <rect x="765" y="155" width="190" height="130" rx="15" class="process"/>
  <text x="860" y="193" text-anchor="middle" class="label">Опрацювати вихід</text>
  <text x="860" y="225" text-anchor="middle" class="small">Зберегти · розібрати</text>
  <text x="860" y="250" text-anchor="middle" class="small">нормалізувати кандидата</text>

  <rect x="1010" y="155" width="190" height="130" rx="15" class="control"/>
  <text x="1105" y="193" text-anchor="middle" class="label">Перевірити</text>
  <text x="1105" y="225" text-anchor="middle" class="small">Перевірити детерміновані</text>
  <text x="1105" y="250" text-anchor="middle" class="small">інваріанти · без запису</text>

  <rect x="1255" y="155" width="190" height="130" rx="15" class="human"/>
  <text x="1350" y="193" text-anchor="middle" class="label">Розгляд людини</text>
  <text x="1350" y="225" text-anchor="middle" class="small">Розглянути значення</text>
  <text x="1350" y="250" text-anchor="middle" class="small">та докази</text>

  <path d="M215 220 H260" class="line"/>
  <path d="M450 220 H480 V172 H505" class="line"/>
  <path d="M450 220 H480 V312 H505" class="fixture"/>
  <path d="M710 172 H735 V220 H765" class="line"/>
  <path d="M710 312 H735 V220 H765" class="fixture"/>
  <path d="M955 220 H1010" class="line"/>
  <path d="M1200 220 H1255" class="line"/>

  <rect x="1070" y="430" width="220" height="125" rx="15" class="human"/>
  <text x="1180" y="468" text-anchor="middle" class="label">Зафіксувати рішення</text>
  <text x="1180" y="500" text-anchor="middle" class="small">Затвердити або відхилити</text>
  <text x="1180" y="525" text-anchor="middle" class="small">дайджест точного кандидата</text>

  <rect x="760" y="430" width="220" height="125" rx="15" class="control"/>
  <text x="870" y="468" text-anchor="middle" class="label">Застосувати</text>
  <text x="870" y="500" text-anchor="middle" class="small">Уповноважений засіб запису</text>
  <text x="870" y="525" text-anchor="middle" class="small">перевіряє відповідне затвердження</text>

  <rect x="430" y="430" width="240" height="125" rx="15" class="state"/>
  <text x="550" y="468" text-anchor="middle" class="label">Прийняті знання</text>
  <text x="550" y="500" text-anchor="middle" class="small">Канонічний запис Markdown</text>
  <text x="550" y="525" text-anchor="middle" class="small">змінюється лише тут</text>

  <path d="M1350 285 V492 H1290" class="line"/>
  <path d="M1070 492 H980" class="line"/>
  <path d="M760 492 H670" class="line"/>

  <rect x="1040" y="675" width="330" height="105" rx="15" class="reject"/>
  <text x="1205" y="714" text-anchor="middle" class="label">Відмовити або запросити виправлення</text>
  <text x="1205" y="746" text-anchor="middle" class="small">Прийняті знання залишаються незмінними</text>
  <text x="1205" y="770" text-anchor="middle" class="small">Змінений кандидат потребує нового рішення</text>

  <path d="M860 285 V625 H1100 V675" class="fail"/><text x="875" y="338" class="no">пошкоджений</text>
  <path d="M1105 285 V675" class="fail"/><text x="1120" y="338" class="no">некоректний</text>
  <path d="M1350 285 V625 H1310 V675" class="fail"/><text x="1365" y="338" class="no">відхилити</text>
  <path d="M1180 555 V635 H1250 V675" class="fail"/><text x="1195" y="608" class="no">відсутнє або застаріле затвердження</text>
  <path d="M870 555 V635 H1160 V675" class="fail"/><text x="885" y="608" class="no">відмова застосування</text>

  <rect x="120" y="675" width="650" height="105" rx="15" class="telemetry"/>
  <text x="445" y="712" text-anchor="middle" class="label">Зіставлена телеметрія та збережені докази процесу</text>
  <text x="445" y="744" text-anchor="middle" class="small">Ідентичність входу · контрольована конфігурація · відповідь · кандидат · перевірка</text>
  <text x="445" y="768" text-anchor="middle" class="small">рішення · застосування або відмова · затримка · клас відмови</text>

  <path d="M125 285 V640 H250 V675" class="observe"/>
  <path d="M355 285 V625 H320 V675" class="observe"/>
  <path d="M607 365 V625 H390 V675" class="observe"/>
  <path d="M860 285 V620 H460 V675" class="observe"/>
  <path d="M1105 285 V615 H530 V675" class="observe"/>
  <path d="M1350 285 V610 H600 V675" class="observe"/>
  <path d="M870 555 V620 H670 V675" class="observe"/>

  <text x="800" y="855" text-anchor="middle" class="caption">Детермінована фікстура перевіряє контракти та межі повноважень; лише живі запуски оцінюють поведінку моделі.</text>
</svg>
