<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">A model response inside an application architecture</title>
  <desc id="desc">A probabilistic model call produces a response. The surrounding application architecture supplies input and output contracts, deterministic validation, human authority, state boundaries, failure handling, and telemetry before accepted state may change.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .frame{fill:#f8fafc;stroke:#334155;stroke-width:3}.model{fill:#e0f2fe;stroke:#0284c7;stroke-width:3}.control{fill:#ecfdf5;stroke:#059669;stroke-width:2.5}.authority{fill:#fef3c7;stroke:#d97706;stroke-width:2.5}.state{fill:#ede9fe;stroke:#7c3aed;stroke-width:2.5}.risk{fill:#fff7ed;stroke:#ea580c;stroke-width:2.5}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2.5;stroke-dasharray:9 7;fill:none}.title{font:700 30px system-ui,sans-serif;fill:#0f172a}.label{font:700 19px system-ui,sans-serif;fill:#0f172a}.small{font:15px system-ui,sans-serif;fill:#334155}.caption{font:700 17px system-ui,sans-serif;fill:#9a3412}
    </style>
  </defs>
  <rect width="1400" height="780" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="title">A response is one event; architecture controls the complete operation</text>

  <rect x="380" y="90" width="640" height="410" rx="22" class="frame"/>
  <text x="700" y="125" text-anchor="middle" class="label">Application architecture</text>

  <rect x="420" y="165" width="210" height="110" rx="14" class="control"/>
  <text x="525" y="200" text-anchor="middle" class="label">Input contract</text>
  <text x="525" y="230" text-anchor="middle" class="small">Instruction · evidence</text>
  <text x="525" y="254" text-anchor="middle" class="small">context limit</text>

  <rect x="700" y="155" width="250" height="130" rx="18" class="model"/>
  <text x="825" y="195" text-anchor="middle" class="label">Foundation model</text>
  <text x="825" y="225" text-anchor="middle" class="small">Next-token generation</text>
  <text x="825" y="250" text-anchor="middle" class="small">sampling · stopping</text>

  <path d="M630 220 H700" class="line"/>

  <rect x="515" y="340" width="230" height="110" rx="14" class="control"/>
  <text x="630" y="375" text-anchor="middle" class="label">Output contract</text>
  <text x="630" y="405" text-anchor="middle" class="small">Parse · validate</text>
  <text x="630" y="429" text-anchor="middle" class="small">contain failure</text>

  <rect x="790" y="340" width="190" height="110" rx="14" class="authority"/>
  <text x="885" y="375" text-anchor="middle" class="label">Human decision</text>
  <text x="885" y="405" text-anchor="middle" class="small">Review meaning</text>
  <text x="885" y="429" text-anchor="middle" class="small">approve or reject</text>

  <path d="M825 285 V315 H630 V340" class="line"/>
  <path d="M745 395 H790" class="line"/>

  <rect x="70" y="180" width="240" height="170" rx="14" class="risk"/>
  <text x="190" y="218" text-anchor="middle" class="label">A direct model call</text>
  <text x="190" y="250" text-anchor="middle" class="small">may return fluent text</text>
  <text x="190" y="278" text-anchor="middle" class="small">but defines no authority,</text>
  <text x="190" y="306" text-anchor="middle" class="small">recovery, or evidence policy</text>
  <path d="M310 265 H380" class="line"/>

  <rect x="1090" y="180" width="240" height="170" rx="14" class="state"/>
  <text x="1210" y="218" text-anchor="middle" class="label">Accepted state</text>
  <text x="1210" y="250" text-anchor="middle" class="small">changes only through</text>
  <text x="1210" y="278" text-anchor="middle" class="small">an authorized operation</text>
  <text x="1210" y="306" text-anchor="middle" class="small">after matching approval</text>
  <path d="M980 395 H1050 V265 H1090" class="line"/>

  <rect x="315" y="570" width="250" height="105" rx="14" class="control"/>
  <text x="440" y="607" text-anchor="middle" class="label">Stable boundaries</text>
  <text x="440" y="638" text-anchor="middle" class="small">Replace model or provider</text>
  <text x="440" y="662" text-anchor="middle" class="small">without changing contracts</text>

  <rect x="595" y="570" width="210" height="105" rx="14" class="control"/>
  <text x="700" y="607" text-anchor="middle" class="label">Telemetry</text>
  <text x="700" y="638" text-anchor="middle" class="small">Explain inputs, outputs,</text>
  <text x="700" y="662" text-anchor="middle" class="small">decisions, and failures</text>

  <rect x="835" y="570" width="250" height="105" rx="14" class="control"/>
  <text x="960" y="607" text-anchor="middle" class="label">State boundaries</text>
  <text x="960" y="638" text-anchor="middle" class="small">Candidate ≠ canonical</text>
  <text x="960" y="662" text-anchor="middle" class="small">Derived ≠ accepted</text>

  <path d="M440 570 V525 H560" class="dash"/>
  <path d="M700 570 V500" class="dash"/>
  <path d="M960 570 V525 H840" class="dash"/>

  <text x="700" y="735" text-anchor="middle" class="caption">Probabilistic generation remains useful because deterministic and human controls surround it.</text>
</svg>
