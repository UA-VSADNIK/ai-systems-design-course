<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Hexagonal architecture pattern in the learning knowledge system</title>
  <desc id="desc">An original course diagram of the hexagonal architecture pattern. A hexagonal application core owns use-case and external-dependency ports. Command and authorized-review adapters connect application entry mechanisms on the left. Model, Markdown vault, and evidence adapters connect external mechanisms on the right. Connector lines show attachment, not one-way information flow.</desc>
  <defs>
    <style>
      .core{fill:#ecfdf5;stroke:#059669;stroke-width:4}.core-inner{fill:#ffffff;stroke:#34d399;stroke-width:2}.port{fill:#ffffff;stroke:#475569;stroke-width:2.5}.adapter{fill:#e0f2fe;stroke:#0284c7;stroke-width:2.5}.external{fill:#ede9fe;stroke:#7c3aed;stroke-width:2.5}.attach{stroke:#475569;stroke-width:3;fill:none}.boundary-label{font:700 15px system-ui,sans-serif;fill:#64748b;letter-spacing:1.2px}.title{font:700 30px system-ui,sans-serif;fill:#0f172a}.subtitle{font:15px system-ui,sans-serif;fill:#475569}.label{font:700 17px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#334155}.tiny{font:14px system-ui,sans-serif;fill:#475569}.core-title{font:700 24px system-ui,sans-serif;fill:#065f46}.core-label{font:700 17px system-ui,sans-serif;fill:#064e3b}.caption{font:700 17px system-ui,sans-serif;fill:#9a3412}.legend{font:14px system-ui,sans-serif;fill:#334155}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="title">Ports and adapters (hexagonal architecture pattern) around one application core</text>
  <text x="800" y="76" text-anchor="middle" class="subtitle">The application owns the ports; adapters translate concrete entry and dependency mechanisms.</text>

  <text x="250" y="125" text-anchor="middle" class="boundary-label">APPLICATION ENTRY · OUTSIDE CORE</text>
  <text x="800" y="125" text-anchor="middle" class="boundary-label">APPLICATION-OWNED LOGIC</text>
  <text x="1370" y="125" text-anchor="middle" class="boundary-label">DEPENDENCIES · OUTSIDE CORE</text>

  <!-- Attachment lines are intentionally non-directional. -->
  <path d="M230 285 H255" class="attach"/>
  <path d="M420 285 H455" class="attach"/>
  <path d="M665 285 H720" class="attach"/>
  <path d="M230 735 H255" class="attach"/>
  <path d="M420 735 H455" class="attach"/>
  <path d="M665 735 H720" class="attach"/>

  <path d="M880 255 H925" class="attach"/>
  <path d="M1115 255 H1140" class="attach"/>
  <path d="M1325 255 H1350" class="attach"/>
  <path d="M880 495 H925" class="attach"/>
  <path d="M1115 495 H1140" class="attach"/>
  <path d="M1325 495 H1350" class="attach"/>
  <path d="M880 735 H925" class="attach"/>
  <path d="M1115 735 H1140" class="attach"/>
  <path d="M1325 735 H1350" class="attach"/>

  <!-- The hexagon is a boundary metaphor, not a literal deployment shape. -->
  <polygon points="540,150 960,150 1080,500 960,850 540,850 420,500" class="core"/>
  <text x="750" y="205" text-anchor="middle" class="core-title">Application core</text>
  <text x="750" y="232" text-anchor="middle" class="tiny">Concept-proposal and governed-acceptance capabilities</text>

  <rect x="615" y="325" width="270" height="95" rx="14" class="core-inner"/>
  <text x="750" y="360" text-anchor="middle" class="core-label">Candidate workflow</text>
  <text x="750" y="388" text-anchor="middle" class="small">orchestration and state transitions</text>

  <rect x="615" y="455" width="270" height="95" rx="14" class="core-inner"/>
  <text x="750" y="490" text-anchor="middle" class="core-label">Validation policy</text>
  <text x="750" y="518" text-anchor="middle" class="small">deterministic application rules</text>

  <rect x="615" y="585" width="270" height="95" rx="14" class="core-inner"/>
  <text x="750" y="620" text-anchor="middle" class="core-label">Authority boundary</text>
  <text x="750" y="648" text-anchor="middle" class="small">apply only after matching approval</text>

  <text x="750" y="805" text-anchor="middle" class="small">Depends on application-owned port contracts,</text>
  <text x="750" y="830" text-anchor="middle" class="small">not provider, harness, or filesystem types</text>

  <!-- Application entry mechanisms and adapters. -->
  <rect x="30" y="235" width="200" height="100" rx="14" class="external"/>
  <text x="130" y="272" text-anchor="middle" class="label">Course CLI</text>
  <text x="130" y="300" text-anchor="middle" class="small">or laboratory test</text>

  <rect x="255" y="235" width="165" height="100" rx="14" class="adapter"/>
  <text x="337" y="272" text-anchor="middle" class="label">Command</text>
  <text x="337" y="300" text-anchor="middle" class="small">adapter</text>

  <rect x="455" y="240" width="210" height="90" rx="12" class="port"/>
  <text x="560" y="273" text-anchor="middle" class="label">Concept proposal</text>
  <text x="560" y="301" text-anchor="middle" class="small">use-case port</text>

  <rect x="30" y="685" width="200" height="100" rx="14" class="external"/>
  <text x="130" y="722" text-anchor="middle" class="label">Human reviewer</text>
  <text x="130" y="750" text-anchor="middle" class="small">authorized decision</text>

  <rect x="255" y="685" width="165" height="100" rx="14" class="adapter"/>
  <text x="337" y="722" text-anchor="middle" class="label">Review</text>
  <text x="337" y="750" text-anchor="middle" class="small">adapter</text>

  <rect x="455" y="690" width="210" height="90" rx="12" class="port"/>
  <text x="560" y="723" text-anchor="middle" class="label">Record decision</text>
  <text x="560" y="751" text-anchor="middle" class="small">use-case port</text>

  <!-- External-dependency ports, adapters, and mechanisms. -->
  <rect x="925" y="210" width="190" height="90" rx="12" class="port"/>
  <text x="1020" y="243" text-anchor="middle" class="label">Model generation</text>
  <text x="1020" y="271" text-anchor="middle" class="small">dependency port</text>

  <rect x="1140" y="205" width="185" height="100" rx="14" class="adapter"/>
  <text x="1232" y="242" text-anchor="middle" class="label">Model</text>
  <text x="1232" y="270" text-anchor="middle" class="small">adapter</text>

  <rect x="1350" y="185" width="220" height="140" rx="14" class="external"/>
  <text x="1460" y="220" text-anchor="middle" class="label">Model mechanism</text>
  <text x="1460" y="250" text-anchor="middle" class="small">live · harness / provider API</text>
  <text x="1460" y="276" text-anchor="middle" class="small">live · self-hosted model</text>
  <text x="1460" y="302" text-anchor="middle" class="tiny">test · offline fixture</text>

  <rect x="925" y="450" width="190" height="90" rx="12" class="port"/>
  <text x="1020" y="483" text-anchor="middle" class="label">Vault access</text>
  <text x="1020" y="511" text-anchor="middle" class="small">dependency port</text>

  <rect x="1140" y="445" width="185" height="100" rx="14" class="adapter"/>
  <text x="1232" y="482" text-anchor="middle" class="label">Markdown vault</text>
  <text x="1232" y="510" text-anchor="middle" class="small">adapter</text>

  <rect x="1350" y="435" width="220" height="120" rx="14" class="external"/>
  <text x="1460" y="475" text-anchor="middle" class="label">Owner-controlled vault</text>
  <text x="1460" y="505" text-anchor="middle" class="small">canonical Markdown records</text>
  <text x="1460" y="531" text-anchor="middle" class="tiny">controlled read and write</text>

  <rect x="925" y="690" width="190" height="90" rx="12" class="port"/>
  <text x="1020" y="723" text-anchor="middle" class="label">Telemetry</text>
  <text x="1020" y="751" text-anchor="middle" class="small">dependency port</text>

  <rect x="1140" y="685" width="185" height="100" rx="14" class="adapter"/>
  <text x="1232" y="722" text-anchor="middle" class="label">Telemetry</text>
  <text x="1232" y="750" text-anchor="middle" class="small">adapter</text>

  <rect x="1350" y="675" width="220" height="120" rx="14" class="external"/>
  <text x="1460" y="715" text-anchor="middle" class="label">Telemetry sinks</text>
  <text x="1460" y="745" text-anchor="middle" class="small">logs · operation records</text>
  <text x="1460" y="771" text-anchor="middle" class="tiny">not canonical knowledge</text>

  <text x="800" y="875" text-anchor="middle" class="subtitle">Connector lines show attachment to a port, not one-way information flow.</text>

  <rect x="470" y="900" width="18" height="18" rx="4" class="port"/>
  <text x="500" y="915" class="legend">port: application-owned contract</text>
  <rect x="760" y="900" width="18" height="18" rx="4" class="adapter"/>
  <text x="790" y="915" class="legend">adapter: mechanism translation</text>
  <rect x="1085" y="900" width="18" height="18" rx="4" class="external"/>
  <text x="1115" y="915" class="legend">external mechanism</text>

  <text x="800" y="966" text-anchor="middle" class="caption">The hexagon is an application-boundary metaphor, not a deployment unit or a six-part code structure.</text>
</svg>
