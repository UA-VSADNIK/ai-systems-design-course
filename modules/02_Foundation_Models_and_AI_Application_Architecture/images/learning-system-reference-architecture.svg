<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Reference architecture of the learning knowledge system</title>
  <desc id="desc">Six logical responsibility groups run inside one workstation-local modular monolith. Solid arrows trace a primary model-backed operation: canonical source read, normalized model request and response, structured-output processing, validation, and controlled canonical write. Dashed connectors show telemetry observations. Git-backed project state, canonical vault state, and derived runtime state have distinct recovery boundaries.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="write-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#059669"/></marker>
    <style>
      .runtime{fill:#f8fafc;stroke:#334155;stroke-width:4}.group{fill:#e0f2fe;stroke:#0284c7;stroke-width:2.5}.govern{fill:#ecfdf5;stroke:#059669;stroke-width:2.5}.telemetry{fill:#fef3c7;stroke:#d97706;stroke-width:2.5}.external{fill:#ede9fe;stroke:#7c3aed;stroke-width:3}.port{fill:#ffffff;stroke:#475569;stroke-width:2.5}.state1{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.state2{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.state3{fill:#fef3c7;stroke:#d97706;stroke-width:2}.line{stroke:#334155;stroke-width:2.8;fill:none;marker-end:url(#arrow)}.write{stroke:#059669;stroke-width:3;fill:none;marker-end:url(#write-arrow)}.dash{stroke:#64748b;stroke-width:2.2;stroke-dasharray:9 7;fill:none}.title{font:700 30px system-ui,sans-serif;fill:#0f172a}.label{font:700 18px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#334155}.tiny{font:13px system-ui,sans-serif;fill:#475569}.write-label{font:700 13px system-ui,sans-serif;fill:#047857}.caption{font:700 17px system-ui,sans-serif;fill:#9a3412}
    </style>
  </defs>
  <rect width="1500" height="980" fill="#ffffff"/>
  <text x="750" y="48" text-anchor="middle" class="title">Logical responsibilities inside one workstation-local deployable</text>

  <rect x="250" y="95" width="1000" height="610" rx="24" class="runtime"/>
  <text x="750" y="130" text-anchor="middle" class="label">Course-owned runtime · modular-monolith starting style</text>
  <text x="750" y="154" text-anchor="middle" class="tiny">Technical responsibility groups sit inside cohesive capability modules; they are not top-level domain modules.</text>

  <rect x="305" y="195" width="250" height="120" rx="15" class="group"/>
  <text x="430" y="230" text-anchor="middle" class="label">Application orchestration</text>
  <text x="430" y="262" text-anchor="middle" class="small">Coordinates the use case</text>
  <text x="430" y="287" text-anchor="middle" class="small">without hiding approval</text>

  <rect x="625" y="195" width="250" height="120" rx="15" class="group"/>
  <text x="750" y="230" text-anchor="middle" class="label">Prompt and context</text>
  <text x="750" y="262" text-anchor="middle" class="small">Bounded instruction, evidence,</text>
  <text x="750" y="287" text-anchor="middle" class="small">examples, output contract</text>

  <rect x="945" y="195" width="250" height="120" rx="15" class="group"/>
  <text x="1070" y="230" text-anchor="middle" class="label">Model access</text>
  <text x="1070" y="262" text-anchor="middle" class="small">Stable application port</text>
  <text x="1070" y="287" text-anchor="middle" class="small">and replaceable adapters</text>

  <rect x="305" y="385" width="250" height="120" rx="15" class="group"/>
  <text x="430" y="420" text-anchor="middle" class="label">Structured output</text>
  <text x="430" y="452" text-anchor="middle" class="small">Preserve · parse · normalize</text>
  <text x="430" y="477" text-anchor="middle" class="small">report malformed output</text>

  <rect x="625" y="385" width="250" height="120" rx="15" class="govern"/>
  <text x="750" y="420" text-anchor="middle" class="label">Validate and apply</text>
  <text x="750" y="452" text-anchor="middle" class="small">Separate operations</text>
  <text x="750" y="477" text-anchor="middle" class="small">apply only after approval</text>

  <rect x="945" y="385" width="250" height="120" rx="15" class="telemetry"/>
  <text x="1070" y="420" text-anchor="middle" class="label">Telemetry</text>
  <text x="1070" y="452" text-anchor="middle" class="small">Correlate inputs, outputs,</text>
  <text x="1070" y="477" text-anchor="middle" class="small">decisions, and failures</text>

  <!-- Primary model-backed operation: request, response, validation, and controlled write. -->
  <path d="M555 255 H625" class="line"/>
  <path d="M875 255 H945" class="line"/>
  <path d="M1070 315 V350 H430 V385" class="line"/>
  <text x="750" y="340" text-anchor="middle" class="tiny">normalized response</text>
  <path d="M555 445 H625" class="line"/>
  <path d="M625 470 H585 V590 H235 V285 H215" class="write"/>
  <text x="400" y="580" text-anchor="middle" class="write-label">controlled canonical write</text>

  <!-- Telemetry observes the operation; it is not the next business-data stage. -->
  <path d="M875 445 H945" class="dash"/>
  <path d="M1070 315 V385" class="dash"/>

  <rect x="90" y="195" width="125" height="120" rx="12" class="port"/>
  <text x="152" y="230" text-anchor="middle" class="label">Vault port</text>
  <text x="152" y="262" text-anchor="middle" class="tiny">source read</text>
  <text x="152" y="287" text-anchor="middle" class="tiny">controlled write</text>

  <rect x="25" y="390" width="190" height="150" rx="16" class="external"/>
  <text x="120" y="430" text-anchor="middle" class="label">Markdown vault</text>
  <text x="120" y="462" text-anchor="middle" class="small">Canonical sources,</text>
  <text x="120" y="488" text-anchor="middle" class="small">concepts, questions,</text>
  <text x="120" y="514" text-anchor="middle" class="small">knowledge-change records</text>

  <path d="M120 390 V315" class="line"/>
  <path d="M215 235 H305" class="line"/>
  <text x="260" y="224" text-anchor="middle" class="tiny">read</text>
  <path d="M170 315 V390" class="write"/>
  <text x="186" y="357" text-anchor="start" class="write-label">write</text>

  <rect x="1285" y="195" width="125" height="120" rx="12" class="port"/>
  <text x="1347" y="230" text-anchor="middle" class="label">Model port</text>
  <text x="1347" y="262" text-anchor="middle" class="tiny">normalized request</text>
  <text x="1347" y="287" text-anchor="middle" class="tiny">normalized response</text>

  <rect x="1285" y="390" width="190" height="150" rx="16" class="external"/>
  <text x="1380" y="430" text-anchor="middle" class="label">Model mechanism</text>
  <text x="1380" y="462" text-anchor="middle" class="tiny">live · harness / provider API</text>
  <text x="1380" y="488" text-anchor="middle" class="tiny">live · self-hosted model</text>
  <text x="1380" y="514" text-anchor="middle" class="tiny">test · offline fixture</text>

  <path d="M1195 235 H1285" class="line"/>
  <text x="1240" y="224" text-anchor="middle" class="tiny">request</text>
  <path d="M1285 295 H1195" class="line"/>
  <text x="1240" y="314" text-anchor="middle" class="tiny">response</text>
  <path d="M1325 315 V390" class="line"/>
  <path d="M1370 390 V315" class="line"/>

  <text x="750" y="670" text-anchor="middle" class="tiny">Solid arrows show the primary interaction path; dashed connectors show telemetry observations.</text>

  <rect x="180" y="760" width="340" height="115" rx="15" class="state1"/>
  <text x="350" y="798" text-anchor="middle" class="label">Git-backed project</text>
  <text x="350" y="830" text-anchor="middle" class="small">Requirements · schemas · code</text>
  <text x="350" y="855" text-anchor="middle" class="small">tests · evidence</text>

  <rect x="580" y="760" width="340" height="115" rx="15" class="state2"/>
  <text x="750" y="798" text-anchor="middle" class="label">Canonical vault state</text>
  <text x="750" y="830" text-anchor="middle" class="small">Mutable accepted knowledge</text>
  <text x="750" y="855" text-anchor="middle" class="small">requires separate protection</text>

  <rect x="980" y="760" width="340" height="115" rx="15" class="state3"/>
  <text x="1150" y="798" text-anchor="middle" class="label">Derived runtime state</text>
  <text x="1150" y="830" text-anchor="middle" class="small">Caches · indexes · compiled views</text>
  <text x="1150" y="855" text-anchor="middle" class="small">rebuild from controlled inputs</text>

  <path d="M350 760 V705" class="dash"/>
  <path d="M750 760 V705" class="dash"/>
  <path d="M1150 760 V705" class="dash"/>

  <text x="750" y="940" text-anchor="middle" class="caption">Deployment boundaries, logical responsibilities, and state recovery boundaries answer different questions.</text>
</svg>
