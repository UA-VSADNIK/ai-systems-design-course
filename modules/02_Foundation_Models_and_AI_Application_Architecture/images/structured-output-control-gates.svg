<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Three control gates for structured model output</title>
  <desc id="desc">Model output passes a syntactic parse gate, a deterministic invariant gate, and a human semantic acceptance gate. Failure at any gate leads to refusal and leaves accepted state unchanged.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .input{fill:#e0f2fe;stroke:#0284c7;stroke-width:3}.gate{fill:#f8fafc;stroke:#334155;stroke-width:3}.human{fill:#fef3c7;stroke:#d97706;stroke-width:3}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:3}.reject{fill:#fff7ed;stroke:#ea580c;stroke-width:3}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.fail{stroke:#ea580c;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.title{font:700 30px system-ui,sans-serif;fill:#0f172a}.label{font:700 19px system-ui,sans-serif;fill:#0f172a}.small{font:15px system-ui,sans-serif;fill:#334155}.question{font:700 15px system-ui,sans-serif;fill:#334155}.no{font:700 14px system-ui,sans-serif;fill:#c2410c}.yes{font:700 14px system-ui,sans-serif;fill:#047857}.caption{font:700 17px system-ui,sans-serif;fill:#9a3412}
    </style>
  </defs>
  <rect width="1400" height="720" fill="#ffffff"/>
  <text x="700" y="50" text-anchor="middle" class="title">Structured output must pass three different control gates</text>

  <rect x="55" y="170" width="200" height="135" rx="16" class="input"/>
  <text x="155" y="210" text-anchor="middle" class="label">Model output</text>
  <text x="155" y="244" text-anchor="middle" class="small">Probabilistic token</text>
  <text x="155" y="270" text-anchor="middle" class="small">sequence</text>

  <rect x="320" y="145" width="240" height="185" rx="16" class="gate"/>
  <text x="440" y="185" text-anchor="middle" class="label">1 · Syntactic gate</text>
  <text x="440" y="224" text-anchor="middle" class="question">Can the response be parsed?</text>
  <text x="440" y="259" text-anchor="middle" class="small">Declared representation</text>
  <text x="440" y="285" text-anchor="middle" class="small">Complete structure</text>

  <rect x="625" y="145" width="250" height="185" rx="16" class="gate"/>
  <text x="750" y="185" text-anchor="middle" class="label">2 · Invariant gate</text>
  <text x="750" y="224" text-anchor="middle" class="question">Does the candidate obey</text>
  <text x="750" y="246" text-anchor="middle" class="question">machine-checkable rules?</text>
  <text x="750" y="280" text-anchor="middle" class="small">Fields · IDs · statuses</text>
  <text x="750" y="304" text-anchor="middle" class="small">cross-field constraints</text>

  <rect x="940" y="145" width="260" height="185" rx="16" class="human"/>
  <text x="1070" y="185" text-anchor="middle" class="label">3 · Semantic gate</text>
  <text x="1070" y="224" text-anchor="middle" class="question">Is the meaning correct,</text>
  <text x="1070" y="246" text-anchor="middle" class="question">supported, and useful?</text>
  <text x="1070" y="280" text-anchor="middle" class="small">Authorized reviewer</text>
  <text x="1070" y="304" text-anchor="middle" class="small">examines and decides</text>

  <rect x="1245" y="170" width="110" height="135" rx="16" class="ok"/>
  <text x="1300" y="212" text-anchor="middle" class="label">Eligible</text>
  <text x="1300" y="238" text-anchor="middle" class="label">to apply</text>
  <text x="1300" y="272" text-anchor="middle" class="small">with bound</text>
  <text x="1300" y="294" text-anchor="middle" class="small">approval</text>

  <path d="M255 238 H320" class="line"/><text x="284" y="226" text-anchor="middle" class="yes">response</text>
  <path d="M560 238 H625" class="line"/><text x="592" y="226" text-anchor="middle" class="yes">yes</text>
  <path d="M875 238 H940" class="line"/><text x="907" y="226" text-anchor="middle" class="yes">yes</text>
  <path d="M1200 238 H1245" class="line"/><text x="1222" y="226" text-anchor="middle" class="yes">approve</text>

  <rect x="465" y="505" width="470" height="115" rx="16" class="reject"/>
  <text x="700" y="545" text-anchor="middle" class="label">Refuse, correct, or request another candidate</text>
  <text x="700" y="579" text-anchor="middle" class="small">Record the outcome · leave accepted state unchanged</text>
  <text x="700" y="603" text-anchor="middle" class="small">A later candidate requires a new review and decision</text>

  <path d="M440 330 V445 H590 V505" class="fail"/><text x="455" y="378" class="no">no</text>
  <path d="M750 330 V505" class="fail"/><text x="765" y="378" class="no">no</text>
  <path d="M1070 330 V445 H810 V505" class="fail"/><text x="1085" y="378" class="no">reject</text>

  <text x="700" y="680" text-anchor="middle" class="caption">Valid syntax enables validation; validation success does not establish semantic correctness.</text>
</svg>
