<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">Розширений шлях генерування, доповненого пошуком</title>
  <desc id="desc">Інженерний шлях починається з інформаційної потреби. Переписування запиту формує текстовий запит. Прийнята операція інформаційного пошуку формує ранжований кандидатний вихід. Відбір одиниць інформаційного пошуку формує надані джерельні свідчення. Побудова контексту формує обмежений запит до моделі. Операція пропозиції поняття з використанням моделі формує кандидатне визначення поняття або відмову. Оцінювач-людина окремо оцінює цей згенерований вихід за допомогою інформації, призначеної лише для оцінювача. Наскрізний результат робочого процесу користувача є окремим подальшим спостереженням. Схема є ілюстративним, а не вичерпним поданням.</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7e22ce"/></marker>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  </defs>
  <style>
    text{font-family:Arial,sans-serif;fill:#172554;font-size:19px}
    .small{font-size:15px;fill:#334155}
    .tiny{font-size:14px;fill:#475569}
    .input{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
    .operation{fill:#ecfdf5;stroke:#15803d;stroke-width:2.5}
    .output{fill:#f0fdf4;stroke:#15803d;stroke-width:2}
    .evaluation{fill:#faf5ff;stroke:#7e22ce;stroke-width:2}
    .observation{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .boundary{fill:#ffffff;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 6}
    .flow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#blue-arrow)}
    .result{fill:none;stroke:#15803d;stroke-width:3;marker-end:url(#green-arrow)}
    .eval-flow{fill:none;stroke:#7e22ce;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#purple-arrow)}
    .downstream{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:6 6;marker-end:url(#gray-arrow)}
  </style>

  <rect x="25" y="35" width="1550" height="185" rx="16" class="boundary"/>
  <text x="50" y="70">До та в межах прийнятої операції інформаційного пошуку</text>

  <rect x="40" y="85" width="245" height="112" rx="9" class="input"/>
  <text x="62" y="123">Інформаційна</text>
  <text x="62" y="147">потреба</text>
  <text x="62" y="174" class="small">запитання користувача</text>

  <rect x="325" y="85" width="255" height="112" rx="9" class="operation"/>
  <text x="347" y="123">Переписування</text>
  <text x="347" y="147">запиту</text>
  <text x="347" y="170" class="tiny">формує вхід інформаційного</text>
  <text x="347" y="187" class="tiny">пошуку</text>

  <rect x="620" y="85" width="245" height="112" rx="9" class="input"/>
  <text x="642" y="123">Текстовий запит</text>
  <text x="642" y="150" class="small">вхід інформаційного</text>
  <text x="642" y="172" class="small">пошуку</text>

  <rect x="905" y="85" width="300" height="112" rx="9" class="operation"/>
  <text x="927" y="112">Операція інформаційного</text>
  <text x="927" y="136">пошуку</text>
  <text x="927" y="162" class="tiny">прийнятий компонент модуля 04</text>
  <text x="927" y="184" class="tiny">використано, не перепроєктовано</text>

  <rect x="1245" y="75" width="300" height="130" rx="9" class="output"/>
  <text x="1267" y="105">Ранжований кандидатний</text>
  <text x="1267" y="129">вихід</text>
  <text x="1267" y="153" class="tiny">упорядковані одиниці</text>
  <text x="1267" y="174" class="tiny">інформаційного пошуку</text>
  <text x="1267" y="195" class="tiny">не згенерована відповідь</text>

  <path d="M285 141H325" class="flow"/>
  <path d="M580 141H620" class="result"/>
  <path d="M865 141H905" class="flow"/>
  <path d="M1205 141H1245" class="result"/>

  <rect x="25" y="270" width="1550" height="205" rx="16" class="boundary"/>
  <text x="50" y="305">Доповнення: відібрані одиниці інформаційного пошуку стають обмеженими джерельними свідченнями</text>

  <rect x="140" y="345" width="270" height="82" rx="9" class="operation"/>
  <text x="166" y="370">Відбір одиниць</text>
  <text x="166" y="394">інформаційного пошуку</text>
  <text x="166" y="418" class="small">допускає або вилучає одиниці</text>

  <rect x="505" y="332" width="270" height="108" rx="9" class="output"/>
  <text x="527" y="360">Надані джерельні</text>
  <text x="527" y="384">свідчення</text>
  <text x="527" y="408" class="tiny">відібрані одиниці</text>
  <text x="527" y="429" class="tiny">інформаційного пошуку</text>

  <rect x="870" y="345" width="270" height="82" rx="9" class="operation"/>
  <text x="905" y="378">Побудова контексту</text>
  <text x="905" y="404" class="small">збирає вхід моделі</text>

  <rect x="1235" y="332" width="270" height="108" rx="9" class="output"/>
  <text x="1257" y="365">Обмежений запит</text>
  <text x="1257" y="389">до моделі</text>
  <text x="1257" y="416" class="small">повний вхід операції</text>

  <path d="M1395 205V245H275V345" class="result"/>
  <text x="1005" y="240" class="tiny">відбір починається з ранжованого кандидатного виходу</text>
  <path d="M410 386H505" class="result"/>
  <path d="M775 386H870" class="flow"/>
  <path d="M1140 386H1235" class="result"/>

  <rect x="25" y="525" width="1550" height="190" rx="16" class="boundary"/>
  <text x="50" y="560">Генерування й оцінювання на рівні відповіді</text>

  <rect x="95" y="600" width="330" height="82" rx="9" class="operation"/>
  <text x="125" y="633">Операція пропозиції поняття</text>
  <text x="125" y="658">з використанням моделі</text>

  <rect x="515" y="590" width="300" height="102" rx="9" class="output"/>
  <text x="545" y="623">Кандидатне визначення</text>
  <text x="545" y="648">поняття або відмова</text>
  <text x="545" y="674" class="small">згенерований вихід</text>

  <rect x="920" y="590" width="275" height="102" rx="9" class="evaluation"/>
  <text x="954" y="623">Оцінювання людиною</text>
  <text x="954" y="648" class="small">судження на рівні відповіді</text>
  <text x="954" y="674" class="small">не ранг інформаційного пошуку</text>

  <rect x="1285" y="585" width="245" height="112" rx="9" class="observation"/>
  <text x="1313" y="610">Наскрізний результат</text>
  <text x="1313" y="633">робочого процесу</text>
  <text x="1313" y="656">користувача</text>
  <text x="1313" y="683" class="small">окреме спостереження</text>

  <path d="M1370 427V500H260V600" class="flow"/>
  <path d="M425 641H515" class="result"/>
  <path d="M815 641H920" class="result"/>
  <path d="M815 612V575H1408V590" class="downstream"/>
  <text x="970" y="568" class="tiny">окремий подальший робочий процес користувача</text>

  <rect x="790" y="720" width="450" height="135" rx="9" class="evaluation"/>
  <text x="818" y="752">Інформація, призначена</text>
  <text x="818" y="776">лише для оцінювача</text>
  <text x="818" y="804" class="tiny">ніколи не входить до операції пропозиції</text>
  <text x="818" y="826" class="tiny">поняття з використанням моделі</text>
  <path d="M1015 720V692" class="eval-flow"/>

  <text x="45" y="875" class="small">Суцільні сині: вхід операції · Суцільні зелені: сформований результат · Штрихові фіолетові: шлях лише для оцінювача</text>
  <text x="45" y="903" class="small">Штрихові сірі: окремий подальший шлях робочого процесу користувача · Схема ілюстративна, невичерпна й не надає повноважень запису.</text>
</svg>
