<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Межі оцінювання та окреме уповноваження</title>
<desc id="desc">Свідчення завдання надходять до моделі, кандидат — до перевіряльника, а чинний кандидат — до розгляду людини. Пунктирні лінії спостереження ведуть до оцінювача. Лише уповноваження людини керує уповноваженим засобом запису та прийнятим станом.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="obs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9a3412"/></marker><marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172554;font-size:21px} .small{font-size:16px;fill:#334155}.medium{font-size:18px}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.judge{fill:#fff7ed;stroke:#9a3412;stroke-width:2}.human{fill:#f0fdf4;stroke:#15803d;stroke-width:2}.flow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrow)}.observe{fill:none;stroke:#9a3412;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#obs)}.control{fill:none;stroke:#15803d;stroke-width:3;marker-end:url(#control)}</style>
<rect x="25" y="100" width="200" height="90" rx="9" class="box"/><text x="45" y="137" class="medium">Завдання + джерело</text><text x="49" y="165" class="small">свідчення</text>
<rect x="318" y="100" width="195" height="90" rx="9" class="box"/><text x="353" y="151">Модель</text>
<rect x="610" y="100" width="200" height="90" rx="9" class="box"/><text x="628" y="151">Перевіряльник</text>
<rect x="903" y="100" width="267" height="90" rx="9" class="human"/><text x="917" y="137">Уповноважений</text><text x="917" y="165" class="small">семантичний рецензент</text>
<path d="M225 145H318" class="flow"/><text x="244" y="128" class="small">запит</text><path d="M513 145H610" class="flow"/><text x="525" y="128" class="small">кандидат</text><path d="M810 145H903" class="flow"/><text x="815" y="216" class="small">чинний кандидат</text>
<rect x="500" y="320" width="220" height="90" rx="9" class="judge"/><text x="543" y="357">Оцінювач</text><text x="512" y="385" class="small">оцінки, без повноважень</text>
<path d="M422 190V260H545V320" class="observe"/><text x="325" y="248" class="small">сирий вихід</text><path d="M704 190V320" class="observe"/><text x="711" y="265" class="small">результати перевірок</text><path d="M720 365H1035V190" class="observe"/><text x="790" y="343" class="small">оцінка для розгляду</text>
<rect x="810" y="455" width="160" height="73" rx="9" class="human"/><text x="818" y="497">Засіб запису</text><rect x="1015" y="455" width="155" height="73" rx="9" class="human"/><text x="1030" y="487">Прийнятий</text><text x="1041" y="510" class="small">стан</text>
<path d="M1080 190V430H890V455" class="control"/><text x="668" y="423" class="small">уповноваження точного кандидата</text><path d="M970 491H1015" class="control"/><text x="978" y="476" class="small">запис</text>
<text x="30" y="552" class="small">Суцільні сині: інформація завдання · Пунктирні помаранчеві: спостереження · Суцільні зелені: уповноважене керування</text>
</svg>
