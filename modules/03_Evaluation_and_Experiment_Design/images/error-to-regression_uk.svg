<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="465" viewBox="0 0 1200 465" role="img" aria-labelledby="title desc"><title id="title">Від спостереженої помилки до розглянутого випадку для регресійної перевірки</title><desc id="desc">Спостережена відмова переходить до діагнозу, далі до розгляду людиною очікуваної поведінки, далі до версійованого випадку для регресійної перевірки серед випадків розроблення, далі до обмеженої зміни та повторного оцінювання. Стрілка повернення починає наступну ітерацію зміни та регресійної перевірки.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172554;font-size:18px}.small{font-size:15px;fill:#334155}.compact{font-size:16px}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.review{fill:#f0fdf4;stroke:#15803d;stroke-width:2}.line{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arr)}.return{fill:none;stroke:#15803d;stroke-width:3;stroke-dasharray:9 6;marker-end:url(#loop)}</style>
<rect x="25" y="100" width="200" height="92" rx="9" class="box"/><text x="42" y="140" class="compact">Спостережена відмова</text><text x="48" y="169" class="small">зберегти свідчення</text>
<rect x="263" y="100" width="200" height="92" rx="9" class="box"/><text x="305" y="140">Діагноз</text><text x="278" y="169" class="small">локалізувати межу</text>
<rect x="501" y="100" width="200" height="92" rx="9" class="review"/><text x="521" y="140">Розгляд людини</text><text x="512" y="169" class="small">очікувана поведінка</text>
<rect x="739" y="100" width="200" height="92" rx="9" class="box"/><text x="748" y="132" class="compact">Версійований випадок</text><text x="762" y="158" class="small">походження збережено</text><text x="747" y="181" class="small">для випадків розроблення</text>
<rect x="977" y="100" width="200" height="92" rx="9" class="box"/><text x="996" y="140">Обмежена зміна</text><text x="988" y="169" class="small">і повторне оцінювання</text>
<path d="M225 146H263" class="line"/><path d="M463 146H501" class="line"/><path d="M701 146H739" class="line"/><path d="M939 146H977" class="line"/>
<text x="27" y="76" class="small">Спостережені виходи не стають мітками істини без розгляду джерела та рубрики оцінювання.</text>
<path d="M1077 192V327H128V192" class="return"/><text x="272" y="313" class="small">наступна ітерація: змінити конфігурацію і записати результати нових запусків</text>
<text x="25" y="420" class="small">Суцільні сині: послідовність артефактів/рішень · Пунктирні зелені: новий цикл оцінювання</text>
</svg>
