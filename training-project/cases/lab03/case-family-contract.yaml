schema_version: "1.0"
contract_id: lab03-case-family-contract-v1
purpose: >
  Construction rules for course-owned Laboratory 03 evaluation case families.
  Every reserve family must satisfy this contract before its cases can be
  selected for a frozen comparison.
family_rules:
  applies_to: "course-owned held-out reserve families only; development inputs are not families"
  family_id_format: "^[a-z0-9]+(-[a-z0-9]+)*$"
  cases_per_family: 4
  one_case_per_evidence_situation: true
  required_evidence_situations:
    - sufficient-evidence
    - distractor
    - missing-fact
    - explicit-ambiguity
  near_duplicate_rule: >
    Paraphrases and near-duplicates of one source scenario belong to the same
    family. A new family must not paraphrase a case that became development
    feedback or a previously exposed family case.
case_rules:
  case_id_format: "^[a-z0-9]+(-[a-z0-9]+)*$"
  constructed_must_be_labeled: true
  mutation_must_cite_source: true
  supplied_source_must_be_bounded: true
  source_pointers_required: true
expected_behavior_rules:
  evaluator_only: true
  never_in_generator_input: true
  category_vocabulary: [S, I, U, Q, R, X]
  must_state_boundary: true
  approved_by_human_before_scoring: true
deterministic_checks:
  - schema-conformance
  - unique-case-ids
  - case-ids-match-expected-behaviors
  - four-evidence-situations-present
  - supplied-source-nonempty
  - constructed-labels-present
  - source-pointer-sections-resolvable
near_duplicate_checks:
  - exact-case-text
  - normalized-case-text
  - supplied-source-exact-duplicates
